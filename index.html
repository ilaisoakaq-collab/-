<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electro Ilias - إلكترو إلياس</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { 
            background-color: #0f172a; 
            color: #e2e8f0; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
        .animate-bounce { animation: bounce 1s infinite; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ⚠️ مهم جداً: حط هنا رقم الواتساب ديالك (مثال: 212612345678) ⚠️
        const STORE_WHATSAPP_NUMBER = "212771-630123"; 

        const initialProducts = [
          // منتجات ملموسة
          { id: 1, name: 'iPhone 15 Pro Max', price: 13500, category: 'هواتف', image: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=800', description: 'تصميم من التيتانيوم، شريحة A17 Pro الخارقة.', rating: 5, reviews: 124 },
          { id: 2, name: 'MacBook Pro M3', price: 24000, category: 'حواسيب', image: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?q=80&w=800', description: 'قوة لا تضاهى مع معالج M3 الجديد.', rating: 5, reviews: 89 },
          
          // خدمات رقمية
          { id: 3, name: 'اشتراك Apple One (شهر)', price: 149, category: 'اشتراكات رقمية', image: 'https://images.unsplash.com/photo-1611186871348-b1ce696e52c9?q=80&w=800', description: 'باقة أبل وان الشاملة: Apple Music، Apple TV+، Apple Arcade و iCloud. حساب رسمي 100%.', rating: 5, reviews: 215, isDigital: true },
          { id: 4, name: 'اشتراك Netflix Premium (شهر)', price: 35, category: 'اشتراكات رقمية', image: 'https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?q=80&w=800', description: 'حساب نتفليكس 4K، قانوني 100% مع ضمان طيلة مدة الاشتراك.', rating: 5, reviews: 450, isDigital: true },
          { id: 5, name: '1000 متابع انستغرام', price: 49, category: 'خدمات السوشيال ميديا', image: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=800', description: 'متابعين حقيقيين، آمنة لحسابك 100% مع ضمان عدم النقصان.', rating: 5, reviews: 890, isDigital: true },
          { id: 6, name: 'اشتراك Spotify Premium (شهر)', price: 25, category: 'اشتراكات رقمية', image: 'https://images.unsplash.com/photo-1614680376593-902f74a6ce17?q=80&w=800', description: 'استمع للموسيقى بدون إعلانات. تفعيل رسمي على حسابك الشخصي.', rating: 4, reviews: 320, isDigital: true }
        ];

        const getDeliveryDates = () => {
            const today = new Date();
            const minDate = new Date(today); minDate.setDate(today.getDate() + 2);
            const maxDate = new Date(today); maxDate.setDate(today.getDate() + 4);
            const options = { month: 'long', day: 'numeric' };
            return {
                min: minDate.toLocaleDateString('ar-MA', options),
                max: maxDate.toLocaleDateString('ar-MA', options)
            };
        };

        function App() {
          const [products, setProducts] = useState(initialProducts);
          const [view, setView] = useState('store'); 
          const [isScrolled, setIsScrolled] = useState(false);

          const [searchQuery, setSearchQuery] = useState('');
          const [selectedCategory, setSelectedCategory] = useState('الكل');

          const [cartItems, setCartItems] = useState([]);
          const [isCartOpen, setIsCartOpen] = useState(false);
          const [isCheckout, setIsCheckout] = useState(false);
          const [orderSuccess, setOrderSuccess] = useState(false);
          const [orderId, setOrderId] = useState('');
          const [checkoutForm, setCheckoutForm] = useState({ name: '', phone: '', city: '', address: '' });
          
          const [toast, setToast] = useState(null);

          const [isChatOpen, setIsChatOpen] = useState(false);
          const [chatInput, setChatInput] = useState('');
          const [isTyping, setIsTyping] = useState(false);
          const [messages, setMessages] = useState([
            { text: 'مرحباً بك في Electro Ilias! ✨ أنا Jiro. كنبيعو إلكترونيات، اشتراكات رقمية مضمونة (بحال Apple One و Netflix)، وخدمات السوشيال ميديا. كيفاش نقدر نعاونك؟', sender: 'bot' }
          ]);
          const messagesEndRef = useRef(null);

          const [newProduct, setNewProduct] = useState({ name: '', price: '', category: 'هواتف', image: '', description: '', isDigital: false });
          const deliveryDates = getDeliveryDates();

          useEffect(() => { lucide.createIcons(); });
          useEffect(() => {
            const handleScroll = () => setIsScrolled(window.scrollY > 20);
            window.addEventListener('scroll', handleScroll);
            return () => window.removeEventListener('scroll', handleScroll);
          }, []);
          useEffect(() => {
            if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
          }, [messages, isChatOpen, isTyping]);

          const showToast = (message) => {
            setToast(message);
            setTimeout(() => setToast(null), 3000);
          };

          const handleAddProduct = (e) => {
            e.preventDefault();
            if (!newProduct.name || !newProduct.price) return;
            const productToAdd = {
              ...newProduct, id: Date.now(), price: Number(newProduct.price), rating: 5, reviews: 0,
              image: newProduct.image || 'https://images.unsplash.com/photo-1550009158-9ebf6d173303?q=80&w=800'
            };
            setProducts([productToAdd, ...products]);
            setNewProduct({ name: '', price: '', category: 'هواتف', image: '', description: '', isDigital: false });
            showToast('تمت إضافة المنتج للمخزون بنجاح!');
          };

          const handleDeleteProduct = (id) => setProducts(products.filter(p => p.id !== id));

          const handleAddToCart = (product) => {
            setCartItems(prev => {
              const existingItem = prev.find(item => item.id === product.id);
              if (existingItem) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
              return [...prev, { ...product, quantity: 1 }];
            });
            showToast(`تمت إضافة "${product.name}" إلى السلة 🛒`);
          };

          const handleRemoveFromCart = (productId) => setCartItems(prev => prev.filter(item => item.id !== productId));
          const updateCartQuantity = (productId, change) => {
            setCartItems(prev => prev.map(item => {
                if (item.id === productId) {
                    const newQ = item.quantity + change;
                    return newQ > 0 ? { ...item, quantity: newQ } : item;
                }
                return item;
            }));
          };

          const cartTotal = cartItems.reduce((total, item) => total + (item.price * item.quantity), 0);
          const totalItemsInCart = cartItems.reduce((total, item) => total + item.quantity, 0);

          // التحقق واش السلة فيها غير منتجات رقمية (باش مانسولوش على عنوان التوصيل يلا كان غير اشتراك)
          const isOnlyDigitalInCart = cartItems.length > 0 && cartItems.every(item => item.isDigital);

          // إرسال الطلب للواتساب
          const handleCheckoutSubmit = (e) => {
              e.preventDefault();
              
              let orderMessage = `*مرحباً Electro Ilias، بغيت ندوز كوموند جديدة:* 🛍️\n\n`;
              orderMessage += `👤 *معلومات الزبون:*\n`;
              orderMessage += `الاسم: ${checkoutForm.name}\n`;
              orderMessage += `الهاتف: ${checkoutForm.phone}\n`;
              
              // يلا كانت السلة فيها منتجات ملموسة عاد نزيدو العنوان
              if (!isOnlyDigitalInCart) {
                orderMessage += `المدينة: ${checkoutForm.city}\n`;
                orderMessage += `العنوان: ${checkoutForm.address}\n`;
              } else {
                orderMessage += `*الطلب عبارة عن خدمات رقمية (لا يحتاج شحن)* ⚡\n`;
              }
              
              orderMessage += `\n📦 *تفاصيل الطلب:*\n`;
              cartItems.forEach(item => {
                  orderMessage += `- ${item.quantity}x ${item.name} (${item.price} MAD)\n`;
              });
              
              orderMessage += `\n💰 *المجموع الكلي:* ${cartTotal} درهم\n`;
              
              const encodedMessage = encodeURIComponent(orderMessage);
              const whatsappUrl = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${encodedMessage}`;
              
              window.open(whatsappUrl, '_blank');
              
              setOrderId(Math.floor(100000 + Math.random() * 900000).toString());
              setOrderSuccess(true);
              setCartItems([]); 
              setCheckoutForm({ name: '', phone: '', city: '', address: '' });
          };

          const closeCart = () => {
              setIsCartOpen(false);
              setTimeout(() => { setIsCheckout(false); setOrderSuccess(false); }, 300);
          };

          const filteredProducts = products.filter(p => {
              const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.description.toLowerCase().includes(searchQuery.toLowerCase());
              const matchesCategory = selectedCategory === 'الكل' || p.category === selectedCategory;
              return matchesSearch && matchesCategory;
          });

          // دمج الأقسام الموجودة مع أقسام فارغة اختيارية للترتيب
          const allCategories = ['الكل', ...new Set(products.map(p => p.category))];

          const generateBotResponse = (userInput) => {
            const input = userInput.toLowerCase();
            if (input.includes('توصيل') || input.includes('امتا')) return `المنتجات الملموسة كتوصل بين يومين و 4 أيام. أما *الاشتراكات والخدمات الرقمية* فالتسليم ديالها كيكون فوري عبر الواتساب! ⚡`;
            if (input.includes('نتفليكس') || input.includes('ابل') || input.includes('apple') || input.includes('اشتراك') || input.includes('سبوتيفاي')) return `عندنا اشتراكات 100% قانونية ورسمية (Apple One, Netflix, Spotify)، مع ضمان طيلة مدة الاشتراك. مكنخدموش بالكراكات نهائياً!`;
            if (input.includes('متابعين') || input.includes('انستغرام') || input.includes('يوتوب')) return `خدمات السوشيال ميديا ديالنا آمنة للحسابات ديالكم 100%، وعندنا ضمان ديال عدم النقصان.`;
            if (input.includes('قانوني') || input.includes('مضمون') || input.includes('ضمان')) return `كل الخدمات الرقمية ديالنا (اشتراكات أو متابعين) هي قانونية 100% وكتجي مع ضمان كامل طيلة المدة. راحتك هي الأولى! 🛡️`;
            if (input.includes('سلام') || input.includes('مرحبا')) return "وعليكم السلام! مرحبا بيك فـ Electro Ilias. بغيتي منتج ملموس ولا خدمة رقمية؟";
            return "تقدر تسولني على وقت التوصيل، الاشتراكات (ابل وان، نتفليكس...)، خدمات انستغرام، ولا الهواتف.";
          };

          const handleSendMessage = (e) => {
            e?.preventDefault();
            if (!chatInput.trim()) return;
            setMessages(prev => [...prev, { text: chatInput, sender: 'user' }]);
            const currentInput = chatInput;
            setChatInput('');
            setIsTyping(true);
            setTimeout(() => {
              setMessages(prev => [...prev, { text: generateBotResponse(currentInput), sender: 'bot' }]);
              setIsTyping(false);
            }, 1000); 
          };

          return (
            <div className="min-h-screen bg-[#0f172a] text-slate-200 pb-20 sm:pb-0 relative overflow-hidden">
              <div className="fixed top-[-10%] right-[-5%] w-[500px] h-[500px] rounded-full bg-cyan-500/10 blur-[120px] pointer-events-none z-0"></div>
              <div className="fixed bottom-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full bg-indigo-500/10 blur-[150px] pointer-events-none z-0"></div>

              {toast && (
                <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 animate-slide-in">
                    <div className="bg-cyan-500 text-slate-900 px-6 py-3 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.4)] font-bold flex items-center gap-2">
                        <i data-lucide="check-circle" className="w-5 h-5"></i> {toast}
                    </div>
                </div>
              )}

              <header className={`fixed w-full top-0 z-30 transition-all duration-300 ${isScrolled ? 'bg-slate-900/90 backdrop-blur-xl border-b border-white/10 shadow-lg' : 'bg-transparent'}`}>
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex justify-between items-center h-20">
                        <div onClick={() => setView('store')} className="flex-shrink-0 flex items-center gap-3 cursor-pointer">
                            <div className="bg-gradient-to-br from-cyan-400 to-blue-600 p-2.5 rounded-xl text-white shadow-[0_0_15px_rgba(34,211,238,0.3)]">
                                <i data-lucide="zap" className="w-6 h-6 text-white"></i>
                            </div>
                            <span className="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
                                Electro<span className="text-cyan-400">Ilias</span>
                            </span>
                        </div>
                        <div className="flex items-center gap-2 sm:gap-4">
                            <button onClick={() => setView('store')} className={`flex items-center gap-2 px-3 py-2 sm:px-4 rounded-xl font-medium transition-all ${view === 'store' ? 'bg-white/10 text-cyan-400 border border-white/10' : 'text-slate-400 hover:text-white'}`}>
                              <i data-lucide="store" className="w-5 h-5"></i> <span className="hidden sm:inline">المتجر</span>
                            </button>
                            <button onClick={() => setView('admin')} className={`flex items-center gap-2 px-3 py-2 sm:px-4 rounded-xl font-medium transition-all ${view === 'admin' ? 'bg-white/10 text-cyan-400 border border-white/10' : 'text-slate-400 hover:text-white'}`}>
                              <i data-lucide="settings" className="w-5 h-5"></i> <span className="hidden sm:inline">لوحة التحكم</span>
                            </button>
                            
                            <button onClick={() => setIsCartOpen(true)} className="relative p-2 text-slate-300 mr-1 sm:mr-2 border border-white/10 bg-white/5 rounded-xl hover:text-cyan-400 transition-all">
                              <i data-lucide="shopping-cart" className="w-6 h-6"></i>
                              {totalItemsInCart > 0 && <span className="absolute -top-2 -right-2 bg-cyan-500 text-slate-900 text-xs font-bold rounded-full w-6 h-6 flex items-center justify-center border-2 border-slate-900 shadow-md">{totalItemsInCart}</span>}
                            </button>
                        </div>
                    </div>
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-28 relative z-10">
                {view === 'store' && (
                  <div>
                    {/* Trust Banner (شريط الضمان والمصداقية) */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <div className="bg-slate-800/40 border border-cyan-500/20 rounded-2xl p-4 flex items-center gap-4 backdrop-blur-sm">
                            <div className="bg-cyan-500/10 p-3 rounded-full text-cyan-400"><i data-lucide="shield-check" className="w-6 h-6"></i></div>
                            <div>
                                <h4 className="font-bold text-white text-sm">خدمات 100% قانونية</h4>
                                <p className="text-xs text-slate-400 mt-1">طرق رسمية ومضمونة</p>
                            </div>
                        </div>
                        <div className="bg-slate-800/40 border border-purple-500/20 rounded-2xl p-4 flex items-center gap-4 backdrop-blur-sm">
                            <div className="bg-purple-500/10 p-3 rounded-full text-purple-400"><i data-lucide="award" className="w-6 h-6"></i></div>
                            <div>
                                <h4 className="font-bold text-white text-sm">ضمان طيلة مدة الاشتراك</h4>
                                <p className="text-xs text-slate-400 mt-1">تعويض فوري في حالة أي مشكل</p>
                            </div>
                        </div>
                        <div className="bg-slate-800/40 border border-green-500/20 rounded-2xl p-4 flex items-center gap-4 backdrop-blur-sm">
                            <div className="bg-green-500/10 p-3 rounded-full text-green-400"><i data-lucide="zap" className="w-6 h-6"></i></div>
                            <div>
                                <h4 className="font-bold text-white text-sm">تفعيل وتسليم فوري</h4>
                                <p className="text-xs text-slate-400 mt-1">استلم خدمتك الرقمية عبر الواتساب</p>
                            </div>
                        </div>
                    </div>

                    <div className="relative rounded-3xl overflow-hidden mb-12 border border-white/10 bg-gradient-to-br from-slate-800/50 to-slate-900/50 backdrop-blur-xl p-8 sm:p-16 shadow-2xl">
                      <div className="relative z-10 max-w-2xl">
                        <h1 className="text-4xl sm:text-6xl font-black mb-6 text-white leading-tight">
                          إلكترونيات، اشتراكات، و <span className="text-cyan-400">المزيد</span>
                        </h1>
                        <p className="text-slate-400 text-lg sm:text-xl mb-8">اكتشف أحدث الأجهزة الذكية، بالإضافة إلى أفضل العروض على الاشتراكات الرقمية (Apple One, Netflix...) مع ضمان حقيقي 100%.</p>
                        
                        <div className="relative w-full max-w-lg">
                            <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="قلب على Apple One، انستغرام، ايفون..." className="w-full bg-slate-900/80 border border-white/20 rounded-full py-4 pr-6 pl-14 text-white focus:outline-none focus:border-cyan-500 shadow-lg"/>
                            <i data-lucide="search" className="absolute left-5 top-1/2 transform -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        </div>
                      </div>
                    </div>

                    <div className="flex gap-3 overflow-x-auto pb-4 mb-8 scrollbar-hide">
                        {allCategories.map((cat, idx) => (
                            <button key={idx} onClick={() => setSelectedCategory(cat)} className={`whitespace-nowrap px-6 py-2.5 rounded-full font-bold transition-all border ${selectedCategory === cat ? 'bg-cyan-500 text-slate-900 border-cyan-500 shadow-[0_0_15px_rgba(34,211,238,0.4)]' : 'bg-slate-800/50 text-slate-300 border-white/10 hover:border-white/30'}`}>{cat}</button>
                        ))}
                    </div>

                    <div className="flex justify-between items-end mb-8">
                        <h2 className="text-2xl sm:text-3xl font-bold text-white flex items-center gap-3">
                            {selectedCategory === 'الكل' ? 'أحدث المنتجات والخدمات' : selectedCategory} 
                            <span className="text-sm font-normal text-slate-500 bg-slate-800 px-3 py-1 rounded-full">{filteredProducts.length}</span>
                        </h2>
                    </div>

                    {filteredProducts.length === 0 ? (
                        <div className="text-center py-20 bg-slate-800/30 rounded-3xl border border-white/5">
                            <i data-lucide="search-x" className="w-16 h-16 text-slate-500 mx-auto mb-4"></i>
                            <h3 className="text-xl text-slate-300">مالقيناش هاد المنتج</h3>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        {filteredProducts.map((product) => (
                            <div key={product.id} className={`bg-slate-800/40 border ${product.isDigital ? 'border-purple-500/30' : 'border-white/10'} rounded-2xl overflow-hidden backdrop-blur-md flex flex-col group hover:border-cyan-500/50 transition-all hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(34,211,238,0.1)]`}>
                            <div className="aspect-[4/4] bg-slate-900 p-6 flex items-center justify-center relative">
                                <img src={product.image} alt={product.name} className="w-full h-full object-contain relative z-0 group-hover:scale-110 transition-transform duration-500"/>
                                <div className="absolute top-4 right-4 z-20 bg-black/60 backdrop-blur border border-white/10 px-3 py-1 rounded-full text-xs font-bold text-cyan-400">{product.category}</div>
                                
                                {/* شارة الضمان للخدمات الرقمية */}
                                {product.isDigital && (
                                    <div className="absolute top-4 left-4 z-20 bg-gradient-to-r from-purple-500 to-indigo-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg flex items-center gap-1">
                                        <i data-lucide="shield-check" className="w-3 h-3"></i> ضمان 100%
                                    </div>
                                )}
                                {!product.isDigital && product.price > 1000 && (
                                    <div className="absolute top-4 left-4 z-20 bg-green-500/90 text-slate-900 px-3 py-1 rounded-full text-xs font-bold shadow-lg">توصيل مجاني</div>
                                )}
                            </div>
                            <div className="p-6 flex flex-col flex-grow bg-slate-900/80">
                                <h3 className="text-xl font-bold text-white mb-1 group-hover:text-cyan-400 transition-colors">{product.name}</h3>
                                <div className="flex items-center gap-1 mb-3">
                                    {[...Array(5)].map((_, i) => (
                                        <i key={i} data-lucide="star" className={`w-4 h-4 ${i < product.rating ? 'text-amber-400 fill-amber-400' : 'text-slate-600'}`}></i>
                                    ))}
                                    <span className="text-xs text-slate-500 ml-2">({product.reviews})</span>
                                </div>
                                <p className="text-sm text-slate-400 mb-6 flex-grow line-clamp-2">{product.description}</p>
                                <div className="flex items-center justify-between border-t border-white/10 pt-4">
                                <span className="text-2xl font-black text-white">{product.price} <span className="text-sm text-cyan-500">MAD</span></span>
                                <button onClick={() => handleAddToCart(product)} className="bg-white/5 border border-white/10 hover:bg-cyan-500 hover:text-slate-900 text-white p-3 rounded-xl transition-all shadow-lg active:scale-95">
                                    <i data-lucide="shopping-cart" className="w-5 h-5"></i>
                                </button>
                                </div>
                            </div>
                            </div>
                        ))}
                        </div>
                    )}
                  </div>
                )}

                {/* Admin View */}
                {view === 'admin' && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    <div className="lg:col-span-4">
                      <div className="bg-slate-800/40 border border-white/10 rounded-2xl p-6 shadow-xl sticky top-28">
                        <h2 className="text-xl font-bold text-white mb-6 flex items-center gap-2 border-b border-white/10 pb-4">
                          <i data-lucide="plus" className="w-5 h-5 text-cyan-400"></i> إضافة منتج / خدمة
                        </h2>
                        <form onSubmit={handleAddProduct} className="space-y-4">
                          <input type="text" required value={newProduct.name} onChange={(e) => setNewProduct({...newProduct, name: e.target.value})} className="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500" placeholder="اسم المنتج (مثال: اشتراك Apple One)"/>
                          <input type="number" required value={newProduct.price} onChange={(e) => setNewProduct({...newProduct, price: e.target.value})} className="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white outline-none focus:border-cyan-500" placeholder="الثمن (MAD)"/>
                          
                          <select value={newProduct.category} onChange={(e) => setNewProduct({...newProduct, category: e.target.value})} className="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white outline-none">
                            <option value="هواتف" className="bg-slate-800">هواتف وإلكترونيات</option>
                            <option value="اشتراكات رقمية" className="bg-slate-800">اشتراكات رقمية (Apple One, Netflix...)</option>
                            <option value="خدمات السوشيال ميديا" className="bg-slate-800">خدمات السوشيال ميديا</option>
                            <option value="خدمات رقمية" className="bg-slate-800">خدمات أخرى (تصميم...)</option>
                          </select>

                          <label className="flex items-center gap-2 text-slate-300 bg-slate-900/50 p-3 rounded-xl border border-white/10 cursor-pointer hover:border-cyan-500 transition-all">
                              <input type="checkbox" checked={newProduct.isDigital} onChange={(e) => setNewProduct({...newProduct, isDigital: e.target.checked})} className="w-5 h-5 accent-cyan-500 cursor-pointer"/>
                              <span className="text-sm">هذا منتج/خدمة رقمية (بدون شحن، يحصل على شارة ضمان 100%)</span>
                          </label>

                          <input type="url" value={newProduct.image} onChange={(e) => setNewProduct({...newProduct, image: e.target.value})} className="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white text-left outline-none focus:border-cyan-500" placeholder="رابط الصورة (URL)" dir="ltr"/>
                          <textarea value={newProduct.description} onChange={(e) => setNewProduct({...newProduct, description: e.target.value})} className="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white h-24 resize-none outline-none focus:border-cyan-500" placeholder="الوصف (اكتب: ضمان 100% قانوني...)"></textarea>
                          <button type="submit" className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-3 rounded-xl transition-all shadow-[0_0_15px_rgba(34,211,238,0.3)]">إضافة للمتجر</button>
                        </form>
                      </div>
                    </div>
                    <div className="lg:col-span-8">
                      <div className="bg-slate-800/40 border border-white/10 rounded-2xl shadow-xl overflow-hidden min-h-[500px]">
                        <div className="px-6 py-5 border-b border-white/10 bg-slate-900/50 flex justify-between">
                          <h2 className="text-xl font-bold text-white">السلع والخدمات المعروضة ({products.length})</h2>
                        </div>
                        <div className="p-4 space-y-4 max-h-[700px] overflow-y-auto">
                          {products.map((product) => (
                            <div key={product.id} className="bg-slate-900/50 border border-white/5 p-4 rounded-2xl flex flex-col sm:flex-row items-center gap-5 hover:border-white/20 transition-all">
                              <img src={product.image} className="w-16 h-16 object-contain bg-white rounded-lg p-1"/>
                              <div className="flex-grow text-center sm:text-right">
                                <h3 className="font-bold text-white flex items-center justify-center sm:justify-start gap-2">
                                    {product.name}
                                    {product.isDigital && <span className="bg-purple-500/20 text-purple-400 text-[10px] px-2 py-0.5 rounded-full border border-purple-500/30">رقمي</span>}
                                </h3>
                                <span className="text-xs font-bold text-cyan-400 bg-cyan-500/10 px-2 py-1 rounded mt-1 inline-block">{product.price} MAD</span>
                              </div>
                              <button onClick={() => handleDeleteProduct(product.id)} className="p-2 text-red-400 hover:bg-red-500 hover:text-white border border-red-500/30 rounded-lg transition-colors">
                                <i data-lucide="trash-2" className="w-5 h-5"></i>
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </main>

              {/* سلة المشتريات والدفع */}
              {isCartOpen && (
                <div className="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
                  <div className="bg-slate-900 w-full max-w-md h-full shadow-2xl border-l border-white/10 flex flex-col animate-slide-in">
                    <div className="p-5 border-b border-white/10 flex justify-between items-center bg-slate-800/80">
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        {orderSuccess ? <i data-lucide="check-circle" className="text-green-400 w-6 h-6"></i> : 
                         isCheckout ? <button onClick={() => setIsCheckout(false)} className="hover:text-cyan-400"><i data-lucide="arrow-right" className="w-5 h-5"></i></button> 
                         : <i data-lucide="shopping-bag" className="text-cyan-400 w-6 h-6"></i>}
                        {orderSuccess ? 'تم تأكيد الطلب' : isCheckout ? 'تأكيد معلوماتك' : 'سلة المشتريات'}
                      </h2>
                      <button onClick={closeCart} className="text-slate-400 hover:text-white bg-white/5 p-2 rounded-lg transition-colors"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    
                    <div className="flex-grow overflow-y-auto p-6 scrollbar-hide bg-slate-900/50">
                      
                      {!orderSuccess && !isCheckout && cartItems.length === 0 && (
                        <div className="h-full flex flex-col items-center justify-center text-slate-500">
                          <i data-lucide="shopping-cart" className="w-20 h-20 mb-4 opacity-20"></i>
                          <p className="text-lg mb-4">السلة ديالك خاوية حالياً</p>
                          <button onClick={closeCart} className="text-cyan-400 border border-cyan-400 px-6 py-2 rounded-full hover:bg-cyan-400 hover:text-slate-900 transition-colors">تصفح الخدمات</button>
                        </div>
                      )}

                      {!orderSuccess && !isCheckout && cartItems.length > 0 && (
                        <div className="space-y-4">
                            {cartItems.map(item => (
                            <div key={item.id} className="bg-slate-800/80 border border-white/10 rounded-2xl p-4 flex items-center gap-4 relative">
                                <img src={item.image} className="w-20 h-20 object-contain bg-white rounded-xl p-1" />
                                <div className="flex-grow">
                                <h4 className="font-bold text-white text-sm line-clamp-1">{item.name}</h4>
                                <div className="text-cyan-400 text-sm font-bold mt-1">{item.price} MAD</div>
                                <div className="flex items-center gap-3 mt-2 bg-slate-900 w-fit rounded-lg border border-white/10">
                                    <button onClick={() => updateCartQuantity(item.id, 1)} className="p-1 hover:text-cyan-400 text-slate-300"><i data-lucide="plus" className="w-4 h-4"></i></button>
                                    <span className="text-sm font-bold w-4 text-center">{item.quantity}</span>
                                    <button onClick={() => updateCartQuantity(item.id, -1)} className="p-1 hover:text-cyan-400 text-slate-300"><i data-lucide="minus" className="w-4 h-4"></i></button>
                                </div>
                                </div>
                                <button onClick={() => handleRemoveFromCart(item.id)} className="absolute top-4 right-4 text-slate-500 hover:text-red-400 transition-colors"><i data-lucide="trash-2" className="w-5 h-5"></i></button>
                            </div>
                            ))}
                        </div>
                      )}

                      {!orderSuccess && isCheckout && (
                          <form id="checkoutForm" onSubmit={handleCheckoutSubmit} className="space-y-5">
                              <div className="bg-green-500/10 border border-green-500/30 rounded-xl p-4 mb-6">
                                  <div className="flex items-center gap-2 text-green-400 font-bold mb-1"><i data-lucide="message-circle" className="w-5 h-5"></i> تفعيل فوري للخدمات عبر الواتساب</div>
                                  <p className="text-slate-300 text-sm">سيتم تحويلك للواتساب مباشرة لتأكيد طلبك وتفعيل الاشتراكات أو شحن المتابعين.</p>
                              </div>

                              <div>
                                  <label className="block text-sm text-slate-400 mb-2">السمية والكنية *</label>
                                  <input required type="text" value={checkoutForm.name} onChange={e => setCheckoutForm({...checkoutForm, name: e.target.value})} className="w-full bg-slate-800 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-cyan-500 transition-colors" placeholder="مثال: يونس العلوي"/>
                              </div>
                              <div>
                                  <label className="block text-sm text-slate-400 mb-2">رقم التليفون (لي فيه الواتساب) *</label>
                                  <input required type="tel" value={checkoutForm.phone} onChange={e => setCheckoutForm({...checkoutForm, phone: e.target.value})} className="w-full bg-slate-800 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-cyan-500 transition-colors text-right" placeholder="06 00 00 00 00" dir="ltr"/>
                              </div>
                              
                              {/* إخفاء العنوان إذا كان الطلب فقط اشتراكات رقمية */}
                              {!isOnlyDigitalInCart && (
                                <>
                                  <div>
                                      <label className="block text-sm text-slate-400 mb-2">المدينة *</label>
                                      <input required type="text" value={checkoutForm.city} onChange={e => setCheckoutForm({...checkoutForm, city: e.target.value})} className="w-full bg-slate-800 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-cyan-500 transition-colors" placeholder="مثال: الدار البيضاء"/>
                                  </div>
                                  <div>
                                      <label className="block text-sm text-slate-400 mb-2">العنوان كامل (لتوصيل الأجهزة) *</label>
                                      <textarea required value={checkoutForm.address} onChange={e => setCheckoutForm({...checkoutForm, address: e.target.value})} className="w-full bg-slate-800 border border-white/10 p-3 rounded-xl text-white outline-none focus:border-cyan-500 transition-colors resize-none h-24" placeholder="اسم الحي، الزنقة، رقم الدار..."></textarea>
                                  </div>
                                </>
                              )}
                          </form>
                      )}

                      {orderSuccess && (
                          <div className="h-full flex flex-col items-center justify-center text-center animate-in zoom-in duration-500">
                              <div className="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center mb-6">
                                  <i data-lucide="check" className="w-12 h-12 text-green-400"></i>
                              </div>
                              <h3 className="text-2xl font-black text-white mb-2">طلبك داز للواتساب!</h3>
                              <p className="text-slate-400 mb-6">يلا صيفطتي لينا الميساج فالواتساب، غادي يتم تفعيل اشتراكك أو شحن المتابعين فالحين!</p>
                              
                              <div className="bg-slate-800 w-full p-4 rounded-xl border border-white/10 mb-8">
                                  <div className="text-sm text-slate-400 mb-1">رقم العملية (Order ID):</div>
                                  <div className="text-xl font-bold text-cyan-400 tracking-widest">#{orderId}</div>
                              </div>
                              <button onClick={closeCart} className="bg-white/10 text-white w-full py-3 rounded-xl hover:bg-white/20 transition-colors">الرجوع للتصفح</button>
                          </div>
                      )}
                    </div>

                    {!orderSuccess && cartItems.length > 0 && (
                        <div className="p-6 border-t border-white/10 bg-slate-800/80">
                        <div className="flex justify-between items-center mb-6">
                            <span className="text-slate-300 text-lg">المجموع الكلي:</span>
                            <span className="text-3xl font-black text-white">{cartTotal} <span className="text-sm text-cyan-500">MAD</span></span>
                        </div>
                        
                        {!isCheckout ? (
                            <button onClick={() => setIsCheckout(true)} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-bold py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(34,211,238,0.3)] flex justify-center items-center gap-2">
                                إتمام الطلب وتفعيل الخدمة <i data-lucide="arrow-left" className="w-5 h-5"></i>
                            </button>
                        ) : (
                            <button type="submit" form="checkoutForm" className="w-full bg-[#25D366] hover:bg-[#128C7E] text-white font-bold py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(37,211,102,0.4)] flex justify-center items-center gap-2">
                                تأكيد وإرسال عبر واتساب <i data-lucide="send" className="w-5 h-5"></i>
                            </button>
                        )}
                        </div>
                    )}
                  </div>
                </div>
              )}

              {/* Jiro Chatbot */}
              <div className="fixed bottom-6 left-6 z-40 flex flex-col items-start">
                {isChatOpen && (
                  <div className="mb-4 w-80 bg-slate-800/90 backdrop-blur-2xl border border-cyan-500/30 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
                    <div className="bg-slate-900 p-4 border-b border-white/10 flex justify-between items-center">
                      <div className="flex items-center gap-3">
                        <div className="bg-cyan-500 p-2 rounded-full text-slate-900"><i data-lucide="bot" className="w-5 h-5"></i></div>
                        <div><h3 className="font-bold text-white text-sm">Jiro</h3><p className="text-xs text-cyan-400">متصل الآن</p></div>
                      </div>
                      <button onClick={() => setIsChatOpen(false)} className="text-slate-400 p-1.5"><i data-lucide="x" className="w-5 h-5"></i></button>
                    </div>
                    <div className="h-80 overflow-y-auto p-4 space-y-4 bg-slate-900/50">
                      {messages.map((msg, idx) => (
                        <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                          <div className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-sm ${msg.sender === 'user' ? 'bg-cyan-600 text-white rounded-br-sm' : 'bg-slate-700 text-slate-200 rounded-bl-sm'}`}>
                            {msg.text}
                          </div>
                        </div>
                      ))}
                      {isTyping && (
                        <div className="flex justify-start">
                          <div className="bg-slate-700 rounded-2xl px-4 py-3 flex gap-1.5"><span className="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce"></span><span className="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce" style={{animationDelay:'0.1s'}}></span><span className="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce" style={{animationDelay:'0.2s'}}></span></div>
                        </div>
                      )}
                      <div ref={messagesEndRef} />
                    </div>
                    <form onSubmit={handleSendMessage} className="p-3 bg-slate-800 border-t border-white/10 flex">
                      <input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} placeholder="سولني على الاشتراكات والمتابعين..." className="w-full bg-slate-900 border border-white/10 rounded-full py-2 px-4 text-sm text-white outline-none"/>
                      <button type="submit" disabled={!chatInput.trim() || isTyping} className="bg-cyan-500 text-slate-900 p-2 rounded-full ml-2 mr-[-40px] z-10 w-9 h-9 flex justify-center items-center"><i data-lucide="send" className="w-4 h-4 ml-1"></i></button>
                    </form>
                  </div>
                )}
                <button onClick={() => setIsChatOpen(!isChatOpen)} className="bg-cyan-500 text-slate-900 p-4 rounded-full shadow-[0_0_20px_rgba(34,211,238,0.4)] w-14 h-14 flex justify-center items-center transition-transform hover:scale-110">
                  {isChatOpen ? <i data-lucide="x" className="w-7 h-7"></i> : <i data-lucide="message-square" className="w-7 h-7"></i>}
                </button>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
